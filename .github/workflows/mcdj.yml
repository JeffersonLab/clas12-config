name: mcdj

on:
  pull_request:
  push:
    branches: [ main ]
    tags: [ '*' ]

jobs:
  mcgen:
    runs-on: ubuntu-latest
    container:
      image: codecr.jlab.org/hallb/clas12/container-forge/simulation:latest
    steps:
      - uses: actions/checkout@v6
      - name: json
        run: ./mcdj -h
