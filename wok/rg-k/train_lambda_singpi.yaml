io-services:
  reader:
    class: org.jlab.jnp.grapes.io.HipoFrameReader
    name: HipoFrameReader
  writer:
    class: org.jlab.jnp.grapes.io.HipoFrameWriter
    name: HipoFrameWriter
services:
  - class: org.jlab.jnp.grapes.services.LambdaFDWagon
    name: LAMBDAFD
  - class: org.jlab.jnp.grapes.services.SinglePionWagon
    name: SINGPI
configuration:
  global:
    beamEnergy: 8.477
    targetPDG: 2212
  custom-names:
    11: lambda
    12: singpi
  services:
    LAMBDAFD:
      id: 11
    SINGPI:
      id: 12
  io-services:
    writer:
      compression: 2
mime-types:
  - binary/data-hipo-frame
