# LambdaFDWagon uses REC::Particle and REC::VertDoca from the current coatjava.
# The cuts are implemented in LambdaFDWagon.java.
io-services:
  reader:
    class: org.jlab.jnp.grapes.io.HipoFrameReader
    name: HipoFrameReader
  writer:
    class: org.jlab.jnp.grapes.io.HipoFrameWriter
    name: HipoFrameWriter
services:
  - class: org.jlab.jnp.grapes.services.LambdaFDWagon
    name: LAMBDAFD
configuration:
  io-services:
    writer:
      compression: 2
  services:
    LAMBDAFD:
      id: 34
mime-types:
  - binary/data-hipo-frame
